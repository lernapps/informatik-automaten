# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Zustandsdiagramm
  en: State diagrams
description:
  de: "Einen Automaten als Zustandsdiagramm lesen und ergänzen: Kreise für Zustände, Pfeile für Übergänge."
  en: "Read and complete a machine as a state diagram: circles for states, arrows for transitions."
competencies: [zustandsdiagramm]
blocks:
  - type: section
    id: einstieg
    title:
      de: Selins Plan
      en: Selin's plan
    blocks:
      - type: text
        text:
          de: >-
            Jona war lange der Saftautomat. Jetzt braucht er eine Pause. Mia will weiterspielen, aber was muss sie tun? Selin schreibt einen Plan,
            damit jedes Kind den Automaten spielen kann. Auf dieser Seite lernst du, so einen Plan als Bild zu lesen
            und zu ergänzen.
          en: >-
            Jona has been the juice machine for a long time. Now he needs a break. Mia wants to take over, but what does she have to do? Selin writes a plan
            so that any child can play the machine. On this page you learn to read such a plan as a picture and to
            complete it.
      - type: number
        id: zustaende-zaehlen
        text:
          de: "Zuerst schreibt Selin auf, was sich der Automat merken muss. Wie viele verschiedene Zustände hat der Saftautomat?"
          en: "First Selin writes down what the machine has to remember. How many different states does the juice machine have?"
        answer: 3
        tolerance: 0
        mistakes:
          - answer: 2
            message:
              de: "Hast du den leeren Automaten vergessen? Auch „0 € drin“ ist ein Zustand."
              en: "Did you forget the empty machine? “€0 paid” is a state too."
          - answer: 4
            message:
              de: "Mehr als 2 € sind nie drin: Eine dritte Münze kommt zurück."
              en: "There is never more than €2 inside: a third coin comes back."
        hint:
          de: "Was kann Jona auf seinem Zettel stehen haben? Zähl die Geldbeträge."
          en: "What can Jona have written on his note? Count the amounts of money."
        explanation:
          de: "Jona merkt sich nur das Geld: 0 €, 1 € oder 2 €. Das sind drei Zustände."
          en: "Jona only remembers the money: €0, €1 or €2. Those are three states."
  - type: section
    id: idee
    title:
      de: Vom Plan zum Diagramm
      en: From the plan to the diagram
    blocks:
      - type: table
        caption:
          de: "Selins Plan als Tabelle: Wohin springt der Automat in welchem Zustand bei welcher Eingabe, und was kommt dabei heraus?"
          en: "Selin's plan as a table: where does the machine jump in which state with which input, and what comes out?"
        header:
          - { de: Jetzt, en: Now }
          - { de: Eingabe / Ausgabe, en: Input / output }
          - { de: Danach, en: After }
        rows:
          - - { de: "0 € drin", en: "€0 paid" }
            - { de: Münze, en: coin }
            - { de: "1 € drin", en: "€1 paid" }
          - - { de: "0 € drin", en: "€0 paid" }
            - { de: Knopf, en: button }
            - { de: "0 € drin", en: "€0 paid" }
          - - { de: "1 € drin", en: "€1 paid" }
            - { de: Münze, en: coin }
            - { de: "2 € drin", en: "€2 paid" }
          - - { de: "1 € drin", en: "€1 paid" }
            - { de: Knopf, en: button }
            - { de: "1 € drin", en: "€1 paid" }
          - - { de: "2 € drin", en: "€2 paid" }
            - { de: Münze / Münze kommt zurück, en: coin / coin comes back }
            - { de: "2 € drin", en: "€2 paid" }
          - - { de: "2 € drin", en: "€2 paid" }
            - { de: Knopf / Saft fällt heraus, en: button / juice drops out }
            - { de: "0 € drin", en: "€0 paid" }
      - type: text
        text:
          de: >-
            Die Tabelle stimmt, aber sie ist lang. Selin zeichnet sie deshalb als Bild: Jeder Zustand wird ein Kreis.
            Jede Zeile wird ein Pfeil vom Kreis „Jetzt“ zum Kreis „Danach“. Am Pfeil steht, wie in der Tabelle, erst die Eingabe
            (blau) und nach dem Schrägstrich die Ausgabe (orange). Ein Pfeil mit dem Wort „Start“ zeigt auf
            den Kreis, bei dem der Automat anfängt. Unten kannst du Selins Bild ausprobieren.
          en: >-
            The table is right, but it is long. So Selin draws it as a picture: each state becomes a circle. Each row
            becomes an arrow from the “Now” circle to the “After” circle. As in the table, the input comes first next to
            the arrow (blue), and the output after the slash (orange). An arrow with the word “Start”
            points to the circle where the machine begins. Below you can try out Selin's picture.
      - type: definition
        term:
          de: Zustandsdiagramm
          en: state diagram
        explanation:
          de: Ein Zustandsdiagramm zeigt alle Zustände eines Automaten als Kreise und alle Übergänge als Pfeile, mit Eingabe und Ausgabe.
          en: A state diagram (also called a state transition diagram) shows all states of a machine as circles and all transitions as arrows, with their input and output.
      - type: definition
        term:
          de: Übergang
          en: transition
        explanation:
          de: Ein Übergang ist der Sprung von einem Zustand zum nächsten bei einer Eingabe. Der nächste kann auch derselbe Zustand sein. Im Diagramm ist er ein Pfeil.
          en: A transition is the jump from one state to the next when there is an input. The next state can also be the same one. In the diagram it is an arrow.
      - type: definition
        term:
          de: Startzustand
          en: start state
        explanation:
          de: Der Startzustand ist der Zustand, in dem ein Automat anfängt. Im Diagramm zeigt der Pfeil mit „Start“ auf ihn.
          en: The start state is the state a machine begins in. In the diagram, the arrow marked “Start” points to it.
  - type: section
    id: ausprobieren
    title:
      de: Ausprobieren
      en: Try it out
    blocks:
      - type: vue-component
        component: AutomatSimulator
        props:
          automata: { data: automaten }
          automat: 0
          view: diagramm
          startWord: { de: Start, en: Start }
          inputsLabel: { de: "Eingaben: Münze oder Knopf", en: "Inputs: coin or button" }
          now: { de: "Jetzt: {state}", en: "Now: {state}" }
          outputLine: { de: "Ausgabe: {output}", en: "Output: {output}" }
          noOutput: { de: nichts, en: nothing }
          historyWord: { de: "Bisher:", en: "So far:" }
          reset: { de: Zurück zum Start, en: Back to start }
        nojs:
          de: |-
            Der Simulator zeigt Selins Zustandsdiagramm des Saftautomaten. Drei Kreise: „0 € drin“ (Startzustand), „1 € drin“ und „2 € drin“. Die Pfeile:

            - 0 € drin – Münze → 1 € drin
            - 0 € drin – Knopf → 0 € drin
            - 1 € drin – Münze → 2 € drin
            - 1 € drin – Knopf → 1 € drin
            - 2 € drin – Münze → 2 € drin (Ausgabe: Münze kommt zurück)
            - 2 € drin – Knopf → 0 € drin (Ausgabe: Saft fällt heraus)

            Mit JavaScript drückst du die Eingaben „Münze“ und „Knopf“ und siehst den Automaten springen.
          en: |-
            The simulator shows Selin's state diagram of the juice machine. Three circles: “€0 paid” (start state), “€1 paid” and “€2 paid”. The arrows:

            - €0 paid – coin → €1 paid
            - €0 paid – button → €0 paid
            - €1 paid – coin → €2 paid
            - €1 paid – button → €1 paid
            - €2 paid – coin → €2 paid (output: coin comes back)
            - €2 paid – button → €0 paid (output: juice drops out)

            With JavaScript you press the inputs “coin” and “button” and watch the machine jump.
      - type: single-choice
        id: saft-bekommen
        text:
          de: "Drück im Simulator „Münze“ und „Knopf“. Der grüne Kreis zeigt den Zustand jetzt, der dicke grüne Pfeil den letzten Sprung. Mit welchen Eingaben bekommst du vom leeren Automaten einen Saft?"
          en: "Press “coin” and “button” in the simulator. The green circle shows the state now, the thick green arrow the last jump. With which inputs do you get a juice from the empty machine?"
        options:
          - text: { de: "Münze, Münze, Knopf", en: "coin, coin, button" }
            correct: true
            info:
              de: Nach zwei Münzen ist der Automat bei „2 € drin“. Dort führt der Pfeil „Knopf“ zur Ausgabe „Saft fällt heraus“.
              en: After two coins the machine is at “€2 paid”. From there the arrow “button” gives the output “juice drops out”.
          - text: { de: "Münze, Knopf", en: "coin, button" }
            correct: false
            info:
              de: Nach einer Münze ist der Automat bei „1 € drin“. Dort führt der Pfeil „Knopf“ zurück zum selben Kreis, ohne Ausgabe.
              en: After one coin the machine is at “€1 paid”. From there the arrow “button” goes back to the same circle, with no output.
          - text: { de: "Knopf, Münze, Münze", en: "button, coin, coin" }
            correct: false
            info:
              de: Der Knopf am Anfang bringt nichts, der Automat ist ja leer. Am Ende sind 2 € drin, aber niemand drückt mehr den Knopf.
              en: The button at the beginning does nothing, because the machine is empty. At the end €2 is inside, but nobody presses the button any more.
          - text: { de: "Münze, Knopf, Münze", en: "coin, button, coin" }
            correct: false
            info:
              de: Beim Knopf ist erst 1 € drin, das reicht nicht. Danach sind 2 € drin, aber der Knopf kommt nicht mehr.
              en: When you press the button only €1 is inside, which is not enough. After that €2 is inside, but there is no more button press.
        explanation:
          de: Folge vom Start aus den Pfeilen. Ein Saft kommt nur beim Pfeil von „2 € drin“ mit der Eingabe „Knopf“.
          en: Follow the arrows from the start. A juice only comes with the arrow from “€2 paid” with the input “button”.
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: |-
                - In unseren Plänen bekommt jeder Zustand für jede Eingabe einen Pfeil. Ändert sich der Zustand nicht, führt der Pfeil zurück zum selben Kreis, auch wenn etwas herauskommt.
                - Der Automat springt immer zur Spitze des Pfeils.
              en: |-
                - In our plans every state gets an arrow for every input. If the state does not change, the arrow goes back to the same circle, even when something comes out.
                - The machine always jumps to the head of the arrow.
  - type: section
    id: mitmachen
    title:
      de: Nach Plan spielen
      en: Play by the plan
    blocks:
      - type: text
        text:
          de: |-
            Spielt den Automaten zu zweit nach Selins Plan, ohne Computer:

            1. Zeichnet das Diagramm groß auf ein Blatt.
            2. Legt einen Spielstein auf den Startzustand. Der Stein zeigt, wo der Automat gerade ist.
            3. Eine Person sagt eine Eingabe. Die andere schiebt den Stein am passenden Pfeil entlang und sagt die Ausgabe.
            4. Tauscht nach fünf Eingaben.
          en: |-
            Play the machine in pairs by Selin's plan, without a computer:

            1. Draw the diagram large on a sheet of paper.
            2. Put a counter on the start state. The counter shows where the machine is right now.
            3. One person says an input. The other moves the counter along the matching arrow and says the output.
            4. Swap after five inputs.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: text
        text:
          de: >-
            Selin hat noch mehr Pläne gezeichnet: für die Lampe mit Druckknopf, das Drehkreuz am Schwimmbad, den Aufzug und die Fußgängerampel. Bei der Ampel ist auch „Zeit um“ eine
            Eingabe: Die bekommt die Ampel, wenn sie lange genug gleich geblieben ist.
          en: >-
            Selin has drawn more plans: for the lamp with a push button, the turnstile at the swimming pool, the lift and the pedestrian crossing. At the crossing, “time up” is an
            input too: the lights get it when they have stayed the same for long enough.
      - type: matching
        id: diagramm-teile
        text:
          de: Was bedeutet welcher Teil im Zustandsdiagramm?
          en: What does each part of a state diagram mean?
        pairs:
          - left: { de: ein Kreis, en: a circle }
            right: { de: ein Zustand, en: a state }
          - left: { de: ein Pfeil, en: an arrow }
            right: { de: ein Übergang, en: a transition }
          - left: { de: das blaue Wort am Pfeil, en: the blue word next to an arrow }
            right: { de: die Eingabe, en: the input }
          - left: { de: der orange Text nach dem Schrägstrich, en: the orange text after the slash }
            right: { de: die Ausgabe, en: the output }
          - left: { de: "der Kreis, auf den „Start“ zeigt", en: "the circle that “Start” points to" }
            right: { de: der Startzustand, en: the start state }
        explanation:
          de: "Kreise sind, was sich der Automat merken kann. Pfeile sind die Sprünge. Am Pfeil steht erst, was hineinkommt, dann, was herauskommt."
          en: "Circles are what the machine can remember. Arrows are the jumps. Next to an arrow comes first what goes in, then what comes out."
      - type: vue-component
        id: folge-lesen
        component: AutomatAufgabe
        props:
          automata: { data: automaten }
          use: [0, 1, 2, 3, 4]
          mode: folge
          view: diagramm
          task:
            de: "{automat}: Der Automat startet bei „{start}“. Dann kommen diese Eingaben: {inputs}. In welchem Zustand ist er am Ende?"
            en: "{automat}: the machine begins at “{start}”. Then come these inputs: {inputs}. Which state is it in at the end?"
          startWord: { de: Start, en: Start }
          chooseLabel: { de: Zustand am Ende, en: State at the end }
          outputWord: { de: Ausgabe, en: output }
          mistakes:
            - de: "Hast du die letzte Eingabe „{last}“ mitgezählt? Folge auch ihrem Pfeil."
              en: "Did you count the last input “{last}”? Follow its arrow too."
            - de: "Schau bei jedem Schritt, wohin die Spitze des Pfeils zeigt. Der Automat springt immer zur Spitze."
              en: "At each step, look where the head of the arrow points. The machine always jumps to the head."
            - de: "Am Ende ist der Automat nicht beim Start. Geh vom Start aus jede Eingabe einzeln durch: Bei jeder springt er entlang des Pfeils mit diesem Wort."
              en: "At the end the machine is not at the start. Go through each input from the start: with each one it jumps along the arrow with that word."
          other:
            de: "Fang bei „{start}“ an und geh die Eingaben einzeln durch. Achte auf Pfeile zurück zum selben Kreis."
            en: "Begin at “{start}” and go through the inputs one by one. Look out for arrows that go back to the same circle."
        examples:
          accepted:
            - { answer: 0, seed: 1 }
          rejected:
            - { answer: 2, seed: 1 }
      - type: vue-component
        id: pfeil-ergaenzen
        component: AutomatAufgabe
        props:
          automata: { data: automaten }
          use: [0, 1, 2, 3, 4]
          mode: pfeil
          view: diagramm
          task:
            de: "{automat}: Der gestrichelte Pfeil „{input}“ von „{from}“ hat noch kein Ziel. {text} Wohin führt der Pfeil?"
            en: "{automat}: the dashed arrow “{input}” from “{from}” has no end yet. {text} Where does the arrow lead?"
          startWord: { de: Start, en: Start }
          chooseLabel: { de: Der Pfeil führt zu, en: The arrow leads to }
          outputWord: { de: Ausgabe, en: output }
          mistakes:
            - de: "Lies den Satz noch einmal: Merkt sich der Automat danach etwas anderes als vorher? Dann führt der Pfeil zu einem anderen Kreis."
              en: "Read the sentence again: does the machine remember something different afterwards? Then the arrow leads to another circle."
            - de: "Lies den Satz noch einmal: Der Automat merkt sich danach dasselbe wie vorher. Dann führt der Pfeil zurück zum selben Kreis."
              en: "Read the sentence again: afterwards the machine remembers the same as before. Then the arrow goes back to the same circle."
          other:
            de: "Lies den Satz noch einmal: Was merkt sich der Automat danach? Such den Kreis mit genau diesem Zustand."
            en: "Read the sentence again: what does the machine remember afterwards? Find the circle with exactly that state."
        examples:
          accepted:
            - { answer: 1, seed: 1 }
          rejected:
            - { answer: 0, seed: 1 }
      - type: true-false
        id: diagramm-jetzt
        text:
          de: "Mia schaut auf Selins Plan am Karton und sagt: „Auf dem Plan sehe ich, wie viel Geld gerade im Automaten ist.“ Stimmt das?"
          en: "Mia looks at Selin's plan on the box and says: “On the plan I can see how much money is in the machine right now.” Is that true?"
        answer: false
        explanation:
          de: "Der Plan zeigt alle Zustände, die der Automat haben kann, und alle Pfeile. Wo er gerade ist, weiß nur, wer ihn spielt. Im Simulator zeigt es der grüne Kreis, auf Papier der Spielstein."
          en: "The plan shows all the states the machine can have, and all the arrows. Only the person playing it knows where it is right now. In the simulator the green circle shows it, on paper the counter."
  - type: section
    id: rueckblick
    title:
      de: Rückblick
      en: Looking back
    blocks:
      - type: text
        text:
          de: >-
            Geschafft: Selins Plan hängt jetzt am Karton, und Mia spielt den Automaten ohne Fehler. Du kannst ein
            Zustandsdiagramm lesen und fehlende Pfeile ergänzen. In höheren Klassen entwirfst du selbst einen ganzen
            Automaten, zum Beispiel die Ampeln an einer Kreuzung.
          en: >-
            Done: Selin's plan now hangs on the box, and Mia plays the machine without a mistake. You can read a state
            diagram and add missing arrows. In a few years you will design a whole machine yourself, for example the traffic lights
            at a crossroads.
