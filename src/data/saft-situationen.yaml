# Situationen am Saftautomaten für die Übung „Was passiert?“ (Seite alltag/automaten-im-alltag). Jede Zeile: was Jona
# sich gerade merkt (jetzt), was Mia tut (tut), die richtige Reaktion (reaktion, eine der vier Antworten der Übung),
# die Reaktion, die ein Kind ohne Blick auf den Zustand oft wählt (falsch), warum sie nicht passt (warum), und der Grund
# der richtigen Antwort (grund). Der Automat ist der aus automaten.yaml (nr 0): 2 € für einen Saft, nur 1-€-Münzen.
- jetzt: { de: "0 € drin", en: "€0 paid" }
  tut: { de: drückt den Knopf, en: presses the button }
  reaktion: { de: Nichts passiert., en: Nothing happens. }
  falsch: { de: Ein Saft fällt heraus., en: A juice drops out. }
  warum:
    de: "Der Knopf allein reicht nicht. Jona schaut auf seinen Zettel: Es ist noch gar kein Geld drin."
    en: "The button alone is not enough. Jona looks at his note: there is no money inside yet."
  grund:
    de: "Ohne Geld gibt es keinen Saft. Jona merkt sich weiter „0 € drin“."
    en: "Without money there is no juice. Jona still remembers “€0 paid”."
- jetzt: { de: "1 € drin", en: "€1 paid" }
  tut: { de: drückt den Knopf, en: presses the button }
  reaktion: { de: Nichts passiert., en: Nothing happens. }
  falsch: { de: Ein Saft fällt heraus., en: A juice drops out. }
  warum:
    de: "Der Knopf allein reicht nicht. Jona schaut auf seinen Zettel: Erst 1 € ist drin, ein Saft kostet 2 €."
    en: "The button alone is not enough. Jona looks at his note: only €1 is inside, and a juice costs €2."
  grund:
    de: "1 € reicht nicht für einen Saft. Jona merkt sich weiter „1 € drin“."
    en: "€1 is not enough for a juice. Jona still remembers “€1 paid”."
- jetzt: { de: "2 € drin", en: "€2 paid" }
  tut: { de: drückt den Knopf, en: presses the button }
  reaktion: { de: Ein Saft fällt heraus., en: A juice drops out. }
  falsch: { de: Nichts passiert., en: Nothing happens. }
  warum:
    de: "Schau auf Jonas Zettel: 2 € sind drin. Das reicht für einen Saft."
    en: "Look at Jona's note: €2 is inside. That is enough for a juice."
  grund:
    de: "2 € reichen. Ein Saft fällt heraus, und Jona merkt sich danach „0 € drin“."
    en: "€2 is enough. A juice drops out, and afterwards Jona remembers “€0 paid”."
- jetzt: { de: "0 € drin", en: "€0 paid" }
  tut: { de: wirft eine Münze ein, en: puts in a coin }
  reaktion:
    { de: "Nichts kommt heraus, Jona merkt sich mehr Geld.", en: "Nothing comes out, Jona remembers more money." }
  falsch: { de: Die Münze fällt wieder heraus., en: The coin drops out again. }
  warum:
    de: "Der Automat ist leer. Er behält die Münze, denn ein Saft kostet 2 €."
    en: "The machine is empty. It keeps the coin, because a juice costs €2."
  grund:
    de: "Jona behält die Münze und schreibt „1 € drin“ auf seinen Zettel."
    en: "Jona keeps the coin and writes “€1 paid” on his note."
- jetzt: { de: "1 € drin", en: "€1 paid" }
  tut: { de: wirft eine Münze ein, en: puts in a coin }
  reaktion:
    { de: "Nichts kommt heraus, Jona merkt sich mehr Geld.", en: "Nothing comes out, Jona remembers more money." }
  falsch: { de: Ein Saft fällt heraus., en: A juice drops out. }
  warum:
    de: "Jetzt ist zwar genug Geld drin, aber den Saft gibt es erst, wenn Mia den Knopf drückt."
    en: "Now there is enough money inside, but the juice only comes when Mia presses the button."
  grund:
    de: "Jona behält die Münze und schreibt „2 € drin“ auf seinen Zettel. Einen Saft gibt es erst beim Knopf."
    en: "Jona keeps the coin and writes “€2 paid” on his note. The juice only comes with the button."
- jetzt: { de: "2 € drin", en: "€2 paid" }
  tut: { de: wirft eine Münze ein, en: puts in a coin }
  reaktion: { de: Die Münze fällt wieder heraus., en: The coin drops out again. }
  falsch: { de: "Nichts kommt heraus, Jona merkt sich mehr Geld.", en: "Nothing comes out, Jona remembers more money." }
  warum:
    de: "Mehr als 2 € braucht der Automat nie. Auf Jonas Zettel gibt es kein „3 € drin“."
    en: "The machine never needs more than €2. There is no “€3 paid” on Jona's note."
  grund:
    de: "Es ist schon genug Geld drin. Die Münze fällt wieder heraus, Jona merkt sich weiter „2 € drin“."
    en: "There is already enough money inside. The coin drops out again, and Jona still remembers “€2 paid”."
